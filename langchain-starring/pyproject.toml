[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-starring"
version = "0.1.1"
description = "LangChain callback that blocks malicious agent tool-call chains (behavior-chain security)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Star-Ring AI Behavior Security Lab" }]
keywords = ["langchain", "agent", "security", "behavior", "llm", "callback"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "langchain-core>=0.2.0",
]

[tool.setuptools]
py-modules = ["xh_engine"]
packages = ["starring"]

[project.urls]
Homepage = "https://github.com/starring-ai-sec/star-ring-agent-sentinel"
